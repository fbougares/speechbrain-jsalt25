############################################################################
# Model: Zero-Shot Multi-Speaker Tacotron2
# Tokens: ARPAbet Phonemes
# Training: LibriTTS
# Authors: Georges Abous-Rjeili, Artem Ploujnikov, Yingzhi Wang, Pradnya Kandarkar
# ############################################################################


###################################
# Experiment Parameters and setup #
###################################
seed: 1234
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]
output_folder: !ref /home/fbougares/jsalt25/speechbrain_exps/results/encodec/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt
epochs: 2
keep_checkpoint_interval: 50
use_tensorboard: False



###################################
# Progress Samples                #
###################################
# Progress samples are used to monitor the progress
# of an ongoing training session by outputting samples
# of spectrogram, alignment, etc. at regular intervals

# Whether to enable progress samples
progress_samples: True

# The path where the samples will be stored
progress_sample_path: !ref <output_folder>/samples

# The interval, in epochs. For instance, if it is set to 5,
# progress samples will be output every 5 epochs
progress_samples_interval: 10

# The sample size for raw batch samples saved in batch.pth
# (useful mostly for model debugging)
progress_batch_sample_size: 3

#################################
# Data files and pre-processing #
#################################
data_folder: /home/fbougares/jsalt25/speechbrain_exps/data # e.g, /localscratch/LibriTTS/

# Files to hold the manifest data
train_csv: !ref <data_folder>/train.csv
valid_csv: !ref <data_folder>/valid.csv
test_csv: !ref <data_folder>/test.csv

# Files to hold the speaker embeddings - corresponding to the data manifest files
#train_speaker_embeddings_pickle: !ref <save_folder>/train_speaker_embeddings.pickle
#valid_speaker_embeddings_pickle: !ref <save_folder>/valid_speaker_embeddings.pickle
#test_speaker_embeddings_pickle: !ref <save_folder>/test_speaker_embeddings.pickle

# Data splits
skip_prep: True
splits: ["train", "valid", "test"]

# train_split: ["train-clean-100", "train-clean-360"]
train_split: ["train-clean-100"]
valid_split: ["dev-clean"]
test_split: ["test-clean"]

# Use the original preprocessing from nvidia
# The cleaners to be used (applicable to nvidia only)
text_cleaners: ['english_cleaners']

# Avoid audios longer than x seconds
avoid_if_longer_than: 10000.0



################################
# Optimization Hyperparameters #
################################


lr_scheduler:
  warmup_epoch: 5

learning_rate: 3e-4
disc_learning_rate: 3e-4
weight_decay: 0.000006
batch_size: 1 #minimum 2


train_dataloader_opts:
  batch_size: !ref <batch_size>
  drop_last: True  #True #False
  num_workers: 0

valid_dataloader_opts:
  batch_size: !ref <batch_size>
  drop_last: True
  num_workers: 0

test_dataloader_opts:
  batch_size: !ref <batch_size>
  drop_last: True
  num_workers: 0

###############################
# Model Parameters and model  #
###############################
########################################### FETHI ##########################################@@
################################
# Audio Parameters             #
################################
sample_rate: 24_000
hop_length: 256
win_length: 1024
n_mel_channels: 80
n_fft: 1024
mel_fmin: 0.0
mel_fmax: 8000.0
mel_normalized: False
power: 1
norm: "slaney"
mel_scale: "slaney"
dynamic_range_compression: True


channels: 1
target_bandwidths: [3., 6., 12., 24.]
causal: True
model_norm: "weight_norm"
audio_normalize: False
segment: "None"
name: "unset"
ratios: [8, 5, 4, 2]




# To compute the mel-spectrogram for an audio
mel_spectogram: !name:speechbrain.lobes.models.HifiGAN.mel_spectogram
  sample_rate: !ref <sample_rate>
  hop_length: !ref <hop_length>
  win_length: !ref <win_length>
  n_fft: !ref <n_fft>
  n_mels: !ref <n_mel_channels>
  f_min: !ref <mel_fmin>
  f_max: !ref <mel_fmax>
  power: !ref <power>
  normalized: !ref <mel_normalized>
  norm: !ref <norm>
  mel_scale: !ref <mel_scale>
  compression: !ref <dynamic_range_compression>


encoder: !new:speechbrain.lobes.models.Encodec.EncodecEncoder

quantizer: !new:speechbrain.quantization.vq.ResidualVectorQuantizer
  dimension: 128
  n_q: 8
  bins: 1024
  decay: 0.99
  kmeans_init: True
  kmeans_iters: 50
  threshold_ema_dead_code: 2

decoder: !new:speechbrain.lobes.models.Encodec.EncodecDecoder


disc_model: !new:speechbrain.lobes.models.msstftd.MultiScaleSTFTDiscriminator
  in_channels: 1
  out_channels: 1
  filters: 32 
  hop_lengths: [256, 512, 128] 
  win_lengths: [1024, 2048, 512]
  n_ffts: [1024, 2048, 512]


  # channels: 1 #!ref <>
  # dimension: 128 #!ref <>
  # n_filters: 32 #!ref <>
  # n_residual_layers: 1
  # ratios: [8, 5, 4 ,2]
  # activation: 'ELU'
  # norm: 'weight_norm'
  # norm_params:
  # kernel_size: 7
  # causal: False
  # pad_mode: False
  # true_skip: False
  # compress: 2
  # lstm: 2

# Overall modules used
modules:
  encoder: !ref <encoder>
  quantizer: !ref <quantizer>
  decoder: !ref <decoder>
  disc_model: !ref <disc_model>


model: !new:torch.nn.ModuleList
  - [!ref <encoder>, !ref <quantizer>, !ref <decoder>]


# Optimizer
model_opt_class: !name:torch.optim.Adam
  lr: !ref <learning_rate>

disc_opt_class: !name:torch.optim.Adam
  lr: !ref <disc_learning_rate>


##>>>>  loss_mel_spec: !name:torch.nn.functional.

# To keep track of the epochs
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
  limit: !ref <epochs>

# To log training information
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
  save_file: !ref <train_log>

# # Learning rate annealing function
lr_annealing: !new:speechbrain.models.scheduler.WarmupCosineLrScheduler
  max_iter: 100000 # should be max_epoch*len(trainloader)
  eta_ratio: 0,
  warmup_iter: 500,
  warmup_ratio: 5e-4,
  warmup: 'exp',
  last_epoch: -1,

lr_annealing_disc: !new:speechbrain.models.scheduler.WarmupCosineLrScheduler
  max_iter: 100000 # should be max_epoch*len(trainloader)
  eta_ratio: 0,
  warmup_iter: 500,
  warmup_ratio: 5e-4,
  warmup: 'exp',
  last_epoch: -1,

# Checkpointer
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: !ref <save_folder>
  recoverables:
    model: !ref <model>
    disc_model: !ref <disc_model>
    scheduler_model: !ref <lr_annealing>
    scheduler_disc: !ref <lr_annealing_disc>
    counter: !ref <epoch_counter>

# Progress sample logger
progress_sample_logger: !new:speechbrain.utils.train_logger.ProgressSampleLogger
  output_path: !ref <progress_sample_path>
  batch_sample_size: !ref <progress_batch_sample_size>
  formats:
    raw_batch: raw
